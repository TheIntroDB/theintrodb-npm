name: Pull Request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 22 is the floor the devDependency tree supports (lint-staged
        # needs >=22.22.1, undici >=22.19.0, semantic-release ^22.14 || >=24.10),
        # and it matches the version the Coverage workflow already uses.
        node-version: [22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `biome ci` is check-only: it fails on lint, assist or formatting drift
      # instead of rewriting the tree the way the local `pnpm lint` script does.
      - name: Lint
        run: pnpm exec biome ci ./src ./test

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
